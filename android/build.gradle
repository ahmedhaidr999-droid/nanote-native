// ---------------------------------------------------------------------------
// Legacy-plugin compatibility shims (isar_flutter_libs 3.1.0+1 & friends).
//
// 1) Namespace: isar_flutter_libs predates AGP 8's required `namespace` DSL
//    but still declares `package` in its AndroidManifest.xml. Inject the
//    manifest package as the namespace, or configuration fails with
//    "Namespace not specified".
//
// 2) compileSdk floor: isar_flutter_libs compiles against SDK 30, but its
//    AndroidX dependencies reference android:attr/lStar (API 31+), which
//    fails verifyReleaseResources with "AAPT: error: resource
//    android:attr/lStar not found". Raise every Android module to 35.
//
// IMPORTANT: these blocks must run BEFORE the `evaluationDependsOn(":app")`
// blocks below — those eagerly evaluate :app during root configuration,
// after which registering afterEvaluate on it is illegal.
// ---------------------------------------------------------------------------
def fixLegacyAndroidPlugin = { sub ->
    if (sub.plugins.hasPlugin('com.android.library') ||
            sub.plugins.hasPlugin('com.android.application')) {
        try {
            def androidExt = sub.extensions.findByName('android')
            if (androidExt == null) {
                return
            }
            if (sub.android.namespace == null || sub.android.namespace == '') {
                def mf = sub.file('src/main/AndroidManifest.xml')
                if (mf.exists()) {
                    def pkg = new XmlSlurper().parse(mf).@package.text()
                    if (pkg != null && pkg != '') {
                        sub.android.namespace = pkg
                        logger.lifecycle("Injected namespace '${pkg}' into ${sub.name}")
                    }
                }
            }
            def raised = false
            try {
                sub.android.compileSdk = 35
                raised = true
            } catch (ignoredSdk) {
                try {
                    sub.android.compileSdkVersion 'android-35'
                    raised = true
                } catch (ignoredSdk2) {
                    logger.warn("could not raise compileSdk for ${sub.name}")
                }
            }
            if (raised) {
                logger.lifecycle("compileSdk raised to 35 for ${sub.name}")
            }
        } catch (e) {
            logger.warn("legacy plugin fix skipped for ${sub.name}: ${e.message}")
        }
    }
}

subprojects { sub ->
    if (sub.state.executed) {
        // Already evaluated (defensive): configure directly.
        fixLegacyAndroidPlugin(sub)
    } else {
        sub.afterEvaluate { fixLegacyAndroidPlugin(it) }
    }
}

// ---------------------------------------------------------------------------
// NDK-free release builds.
//
// flutter_tools adds an EMPTY stub CMakeLists.txt (see
// flutter_tools/gradle/src/main/groovy/CMakeLists.txt — its own comment:
// "Empty file to trick the Android Gradle Plugin to download the NDK") purely
// so AGP fetches an NDK for symbol stripping. The stub produces NOTHING the
// app uses. On machines without a full NDK (CI runners, slim containers) the
// configure step fails on the missing toolchain — so disable every task from
// that stub. Symbol stripping still runs via llvm-strip; when a real NDK is
// absent, android/gradle.properties or the environment provides one.
// ---------------------------------------------------------------------------
subprojects {
    tasks.matching { it.name.contains('CMake') || it.name.contains('cmake') }.configureEach {
        onlyIf { false }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
