plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "com.nanote.nanote_native"
    compileSdk = 35

    // Ship native libs exactly as their AARs provide them: skips AGP's
    // NDK-dependent strip step entirely, so release builds need NO Android
    // NDK on the machine (the bundled libs — pdfium, isar, flutter engine —
    // are release-built and already lean).
    packagingOptions {
        jniLibs {
            keepDebugSymbols += '**/*.so'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    defaultConfig {
        // The published app id per the task book; the namespace keeps the
        // template's Kotlin package (com.nanote.nanote_native).
        applicationId = "com.nanote.native"
        // Engine floor, raised to 23: record_android (audio notes, v6)
        // declares minSdk 23 and fails manifest merge below that.
        minSdk = Math.max(flutter.minSdkVersion, 23)
        // targetSdk 35: newest level fully supported by the Flutter 3.29
        // toolchain (see README — bump with Flutter >= 3.35 + AGP 8.9).
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        // pdfium's AAR also ships dead mips/mips64 ABIs — keep the four
        // ABIs real devices actually use (smaller APK, smaller strip work).
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    lint {
        // Release lint (lintVital) is not part of this project's quality
        // gate and its analysis database costs significant build time and
        // disk on constrained machines.
        checkReleaseBuilds false
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Falls back to debug signing when key.properties is absent;
            // CI then re-signs with apksigner using repository secrets.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}
