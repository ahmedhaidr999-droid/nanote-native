# Heap sizing that works on BOTH constrained hosts (4GB RAM) and CI
# runners (7GB): 2.5G heap + 1G metaspace (AGP's lintVital needs real
# metaspace headroom — 384M OOMed on CI; 4G heap OOM-killed 4GB hosts).
org.gradle.jvmargs=-Xmx2560M -XX:MaxMetaspaceSize=1G
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1024M
android.useAndroidX=true
android.enableJetifier=false
