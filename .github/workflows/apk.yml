name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Drift codegen
        # Generated *.g.dart files are committed, so a generator hiccup
        # cannot break the build — fall back to the committed ones.
        run: |
          dart run build_runner build \
            || (git checkout -- . && echo "::warning::drift codegen failed; using committed .g.dart files")

      - name: Analyze
        # Errors and warnings fail the build; info-level lints (naming
        # conventions of the preserved v2.x public API) do not.
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Sign APK (when keystore secrets are configured)
        env:
          NANOTE_KEYSTORE_BASE64: ${{ secrets.NANOTE_KEYSTORE_BASE64 }}
          NANOTE_KEYSTORE_PASSWORD: ${{ secrets.NANOTE_KEYSTORE_PASSWORD }}
          NANOTE_KEY_ALIAS: ${{ secrets.NANOTE_KEY_ALIAS }}
          NANOTE_KEY_PASSWORD: ${{ secrets.NANOTE_KEY_PASSWORD }}
        if: env.NANOTE_KEYSTORE_BASE64 != ''
        run: |
          echo "$NANOTE_KEYSTORE_BASE64" | base64 -d > /tmp/nanote.keystore
          BT="$ANDROID_HOME/build-tools"
          BT="$(ls -d "$BT"/*/ | sort -V | tail -n1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          cp "$APK" /tmp/unsigned.apk
          "$BT/apksigner" sign \
            --ks /tmp/nanote.keystore \
            --ks-key-alias "$NANOTE_KEY_ALIAS" \
            --ks-pass "pass:$NANOTE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$NANOTE_KEY_PASSWORD" \
            --out "$APK" /tmp/unsigned.apk
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanote-native-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nanote-native-apk
          path: apk

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          mv apk/app-release.apk "apk/nanote-native-v${TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/nanote-native-*.apk
          generate_release_notes: true
