name: Android APK

on:
  push:
    branches: [main]
    tags: ['native-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Isar codegen
        # Generated *.g.dart files are committed, so a generator hiccup cannot
        # break the build — fall back to the committed ones.
        run: |
          dart run build_runner build --delete-conflicting-outputs \
            || (git checkout -- . && echo "::warning::isar codegen failed; using committed .g.dart files")

      - name: Unit tests
        run: |
          rm -f test/widget_test.dart
          flutter test

      # Platform folders are never committed (see .gitignore) — regenerate.
      - name: Generate android platform folder
        run: flutter create --platforms=android --org com.nanote --project-name nanote_native .

      - name: Patch Android manifest & id
        run: |
          GRADLE=android/app/build.gradle
          sed -i 's/com\.nanote\.nanote_native/com.nanote.native/' "$GRADLE"
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="nanote_native"/android:label="Nanote Native"/' "$M"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><application|' "$M"
          # targetSdk 35 = newest level fully supported by the pinned
          # Flutter 3.29 toolchain (AGP 8.1). Bump to 36 together with a
          # Flutter >= 3.35 toolchain + AGP 8.9.
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' "$GRADLE"
          echo "--- patched ---"
          grep -n "applicationId\|targetSdk" "$GRADLE" || true
          grep -n "label=\|uses-permission" "$M" || true

      - name: Build release APK
        run: flutter build apk --release --build-name=2.0.0 --build-number=${{ github.run_number }}

      - name: Sign APK (when keystore secrets are configured)
        env:
          NANOTE_KEYSTORE_BASE64: ${{ secrets.NANOTE_KEYSTORE_BASE64 }}
          NANOTE_KEYSTORE_PASSWORD: ${{ secrets.NANOTE_KEYSTORE_PASSWORD }}
          NANOTE_KEY_ALIAS: ${{ secrets.NANOTE_KEY_ALIAS }}
          NANOTE_KEY_PASSWORD: ${{ secrets.NANOTE_KEY_PASSWORD }}
        run: |
          if [ -z "$NANOTE_KEYSTORE_BASE64" ]; then
            echo "No keystore secrets configured — keeping the debug-signed APK."
            exit 0
          fi
          echo -n "$NANOTE_KEYSTORE_BASE64" | base64 -d > /tmp/nanote.keystore
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          cp "$APK" /tmp/unsigned.apk
          "$BT/apksigner" sign \
            --ks /tmp/nanote.keystore \
            --ks-key-alias "$NANOTE_KEY_ALIAS" \
            --ks-pass "pass:$NANOTE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$NANOTE_KEY_PASSWORD" \
            --out "$APK" /tmp/unsigned.apk
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanote-native-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nanote-native-apk
          path: apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/app-release.apk
          generate_release_notes: true
