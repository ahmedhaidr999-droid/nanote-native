include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/src/generated/**"
    # Vendored pdfx fork: the pigeons/ folder is the Pigeon INPUT spec
    # (regenerates the committed platform code); it references the `pigeon`
    # dev tool which is not an app dependency.
    - "third_party/pdfx/pigeons/**"

linter:
  rules:
    avoid_print: false
    prefer_single_quotes: true
